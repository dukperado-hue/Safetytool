<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safetytool</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">ข้ามไปเนื้อหา / Skip to content</a>
<header>
  <div class="hd-top">
  <div class="brand"><strong>Safetytool</strong></div>
  <div class="models" role="group" aria-labelledby="models-label">
    <span id="models-label" class="muted"></span>
    <button id="m-bowtie" type="button" aria-pressed="true"></button>
    <button id="m-swiss" type="button" aria-pressed="false"></button>
    <button id="m-shell" type="button" aria-pressed="false"></button>
    <button id="m-hfacs" type="button" aria-pressed="false"></button>
    <button id="m-stamp" type="button" aria-pressed="false"></button>
    <button id="m-fram" type="button" aria-pressed="false"></button>
    <span class="sep" aria-hidden="true"></span>
    <span id="events-label" class="muted"></span>
    <button id="m-pyramid" type="button" aria-pressed="false"></button>
  </div>
  </div>
  <div class="tools" role="toolbar" aria-label="Tools">
    <div class="tgroup tg-main">
      <button id="b-undo" type="button" disabled><span class="ic" aria-hidden="true">&#8630;</span><span class="lb"></span></button>
      <button id="b-redo" type="button" disabled><span class="ic" aria-hidden="true">&#8631;</span><span class="lb"></span></button>
      <button id="b-save" type="button"><span class="lb"></span><span class="lbs" aria-hidden="true"></span></button>
      <details id="file-menu" class="more">
        <summary id="b-file"></summary>
        <div class="menu">
          <button id="b-example" type="button"></button>
          <button id="b-new" type="button"></button>
          <button id="b-open" type="button"></button>
          <hr>
          <button id="b-svg" type="button"></button>
          <button id="b-png" type="button"></button>
          <button id="b-csv" type="button"></button>
          <button id="b-print" type="button"></button>
        </div>
      </details>
      <details id="view-menu" class="more">
        <summary id="b-view"></summary>
        <div class="menu">
          <button id="b-panel" type="button" aria-controls="side" aria-expanded="true"></button>
          <button id="b-fit" type="button"></button>
          <label class="chk"><input id="chk-esc" type="checkbox" checked> <span id="lbl-esc"></span></label>
          <fieldset class="fs-set" id="fs-set">
            <legend id="fs-legend"></legend>
            <label class="fs-opt"><input type="radio" name="fs" value="0.9"> <span class="fs-a" style="--k:.9" aria-hidden="true">A</span> <span id="fs-l90"></span></label>
            <label class="fs-opt"><input type="radio" name="fs" value="1" checked> <span class="fs-a" style="--k:1" aria-hidden="true">A</span> <span id="fs-l100"></span></label>
            <label class="fs-opt"><input type="radio" name="fs" value="1.1"> <span class="fs-a" style="--k:1.1" aria-hidden="true">A</span> <span id="fs-l110"></span></label>
            <label class="fs-opt"><input type="radio" name="fs" value="1.2"> <span class="fs-a" style="--k:1.2" aria-hidden="true">A</span> <span id="fs-l120"></span></label>
            <button id="fs-reset" type="button"></button>
          </fieldset>
        </div>
      </details>
    </div>
    <div class="tgroup tg-settings">
      <details id="settings-menu" class="more">
        <summary id="b-settings"></summary>
        <div class="menu">
          <button id="b-help" type="button" aria-pressed="false"></button>
          <button id="b-theme" type="button"></button>
          <button id="b-lang" type="button"></button>
        </div>
      </details>
    </div>
  </div>
  <input id="file" type="file" accept="application/json,.json" hidden>
</header>
<div id="flash" class="flash" role="status" aria-live="polite" hidden></div>
<div id="welcome" class="welcome" role="region" aria-label="Welcome" hidden></div>

<main id="main">
  <section class="work" aria-label="Workspace">
    <div class="tabs" role="tablist">
      <button id="tab-form" role="tab" aria-selected="false" aria-controls="pane-form" type="button" hidden></button>
      <button id="tab-diagram" role="tab" aria-selected="true" aria-controls="pane-diagram" type="button"></button>
      <button id="tab-simulate" role="tab" aria-selected="false" aria-controls="pane-simulate" type="button" hidden></button>
      <button id="tab-compare" role="tab" aria-selected="false" aria-controls="pane-compare" type="button" hidden></button>
      <button id="tab-report" role="tab" aria-selected="false" aria-controls="pane-report" type="button" hidden></button>
      <button id="tab-analysis" role="tab" aria-selected="false" aria-controls="pane-analysis" type="button" hidden></button>
      <button id="tab-table" role="tab" aria-selected="false" aria-controls="pane-table" type="button"></button>
      <button id="tab-meta" role="tab" aria-selected="false" aria-controls="pane-meta" type="button"></button>
      <span class="grow"></span>
      <button id="b-addthreat" type="button"></button>
      <button id="b-addcons" type="button"></button>
    </div>
    <div id="pane-form" role="tabpanel" hidden><div id="form" class="scroll form"></div></div>
    <div id="pane-diagram" role="tabpanel">
      <div id="statline" class="statline" aria-label="Model summary"></div>
      <div id="stage"><svg id="svg" role="img" aria-label="Diagram"></svg></div>
      <div id="legend" class="legend"></div>
    </div>
    <div id="pane-simulate" role="tabpanel" hidden><div id="simulate" class="scroll sim"></div></div>
    <div id="pane-compare" role="tabpanel" hidden><div id="compare" class="scroll sim"></div></div>
    <div id="pane-report" role="tabpanel" hidden><div id="report" class="scroll sim"></div></div>
    <div id="pane-analysis" role="tabpanel" hidden><div id="analysis" class="scroll sim"></div></div>
    <div id="pane-table" role="tabpanel" hidden><div id="table" class="scroll"></div></div>
    <div id="pane-meta" role="tabpanel" hidden><div id="meta" class="panel scroll"></div></div>
  </section>
  <aside class="side" id="side" aria-label="Details, quality checks and help">
    <button id="b-panel-close" type="button" class="panel-close"></button>
    <div class="tabs rtabs" role="tablist">
      <button id="r-inspector" role="tab" aria-selected="true" aria-controls="rp-inspector" type="button"></button>
      <button id="r-quality" role="tab" aria-selected="false" aria-controls="rp-quality" type="button"></button>
      <button id="r-help" role="tab" aria-selected="false" aria-controls="rp-help" type="button"></button>
      <button id="r-gallery" role="tab" aria-selected="false" aria-controls="rp-gallery" type="button"></button>
      <button id="r-links" role="tab" aria-selected="false" aria-controls="rp-links" type="button"></button>
    </div>
    <div id="rp-inspector" role="tabpanel" class="rpanel"><div id="inspector" class="panel"></div></div>
    <div id="rp-quality" role="tabpanel" class="rpanel" hidden><div id="lint" class="panel lint"></div></div>
    <div id="rp-help" role="tabpanel" class="rpanel" hidden><div id="help" class="panel"></div></div>
    <div id="rp-gallery" role="tabpanel" class="rpanel" hidden><div id="gallery" class="panel"></div></div>
    <div id="rp-links" role="tabpanel" class="rpanel" hidden><div id="links" class="panel"></div></div>
  </aside>
</main>
<button id="b-panel-fab" type="button" class="fab" aria-controls="side" aria-expanded="false"></button>
<footer id="footer"></footer>
<div id="print-root" aria-hidden="true"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
